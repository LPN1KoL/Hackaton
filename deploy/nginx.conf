# nginx перед сервисом озеленения: порт 80 → gunicorn (greening:8080).
server {
    listen 80;
    server_name _;

    # генплан Олимпийской деревни — 187 МБ, с геоподосновой больше 300 МБ
    client_max_body_size 1g;
    # файл уходит в сервис потоком, nginx не копит его на диске перед передачей
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # данные просмотра (view.json) — несколько МБ JSON, сжимаются в разы
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://greening:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
